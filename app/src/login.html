<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Tutos Gym Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="public/js/tema.js?v=1"></script>
    <link rel="stylesheet" href="public/css/tema.css?v=1">
    <link rel="icon" href="public/img/logo-default.png">
</head>
<body class="bg-slate-900 font-sans antialiased flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-6">
        <!-- Logo o Marca Superior -->
        <div class="text-center mb-8">
            <div class="flex flex-col items-center gap-3 text-white font-extrabold text-2xl">
                <img class="logo-gym w-20 h-20 rounded-full object-cover" src="public/img/logo-default.png" alt="Logo">
                <span class="nombre-gym leading-tight">Tutos Gym Club</span>
            </div>
            <p class="text-slate-400 text-sm mt-2">Sistema de Gestión Integral para Gimnasios</p>
        </div>

        <!-- Tarjeta de Login -->
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 p-8">
            <h2 class="text-xl font-bold text-slate-800 mb-2">Iniciar Sesión</h2>
            <p class="text-xs text-slate-500 mb-6">Ingresa tus credenciales de administrador para continuar.</p>

            <form id="formLogin" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Correo electrónico</label>
                    <input type="email" id="loginCorreo" required placeholder="admin@gymsoft.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Contraseña</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                </div>

                <div class="flex items-center justify-between text-xs py-1">
                    <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
                        <input type="checkbox" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500"> Recordarme
                    </label>
                    <a href="#" class="text-blue-600 font-bold hover:underline">¿Olvidaste tu contraseña?</a>
                </div>

                <p id="mensajeEstado" class="text-xs text-center rounded-lg py-2 oculto"></p>

                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-600/30 mt-2">
                    Ingresar al Panel
                </button>
            </form>
        </div>

        <!-- Pie de página de la tarjeta -->
        <p class="text-center text-xs text-slate-500 mt-6">
            &copy; 2026 Tutos Gym Club. Todos los derechos reservados.
        </p>
    </div>

    <style>
        .oculto { display: none; }
        #mensajeEstado.exito { background: #d3f5df; color: #146c3a; display: block; }
        #mensajeEstado.error { background: #fbdede; color: #a11414; display: block; }
    </style>
    <script src="public/js/auth.js"></script>
<script src="public/js/branding.js?v=1"></script>
</body>
</html>
