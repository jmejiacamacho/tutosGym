<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Suscripciones - Tutos Gym Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="public/js/tema.js?v=1"></script>
    <link rel="stylesheet" href="public/css/tema.css?v=1">
    <link rel="icon" href="public/img/logo-default.png">
</head>
<body class="bg-slate-100 font-sans antialiased" data-roles-permitidos="1">
    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar Lateral (Estilo Mockup) -->
        <div id="overlaySidebarMovil" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden"></div>
        <aside id="sidebarMovil" class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-6 fixed md:static inset-y-0 left-0 z-50 -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out">
            <div>
                <div class="flex items-center gap-3 text-white font-bold text-lg mb-10">
                    <img class="logo-gym w-12 h-12 rounded-full object-cover" src="public/img/logo-default.png" alt="Logo">
                    <span class="nombre-gym leading-tight">Tutos Gym Club</span>
                </div>
                                <nav class="space-y-2 text-sm">
                    <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400">🏠 Inicio</a>
                    <a href="suscripciones.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600 text-white font-medium shadow-lg shadow-blue-600/30">💳 Suscripciones</a>
                    <a href="reportes.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400">📊 Reportes</a>
                    <a href="admin-maquinas.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400">🏋️‍♂️ Admin. Máquinas</a>
                    <a href="usuarios.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400">👥 Usuarios</a>
                    <a href="configuracion.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400">⚙️ Configuración</a>
                </nav>
            </div>
            <div class="text-xs text-slate-500">v2.4.0 - Gym Management</div>
        </aside>

        <!-- Contenido Principal -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <!-- Header Superior -->
            <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3"><button id="btnMenu" class="md:hidden text-2xl text-slate-600 leading-none">☰</button><h1 class="text-xl font-extrabold text-slate-800">Gestión de Suscripciones</h1></div>
                <div class="flex items-center gap-4">
                    <span id="nombreUsuario" class="text-sm font-medium text-slate-600">Cargando...</span>
                    <div id="inicialesUsuario" class="w-10 h-10 rounded-full bg-slate-300 flex items-center justify-center font-bold text-slate-700">--</div>
                    <button id="btnSalir" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2 rounded-lg font-semibold">Salir</button>
                </div>
            </header>

            <!-- Cuerpo de la Vista -->
            <div class="p-8 max-w-7xl mx-auto w-full">
                <!-- Barra de Acciones y Filtros -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 justify-between items-center">
                    <input type="text" id="buscarSuscripcion" placeholder="Buscar socio por nombre..." class="px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm w-80 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <div class="flex gap-3">
                        <select id="filtroEstado" class="px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-600">
                            <option value="">Filtrar por Estado</option>
                            <option value="activa">Activo</option>
                            <option value="vencida">Vencido</option>
                        </select>
                        <button id="btnNuevaSuscripcion" class="bg-blue-600 text-white px-5 py-2 rounded-xl text-sm font-semibold hover:bg-blue-700 transition shadow-md shadow-blue-600/20">+ Nueva Suscripción</button>
                    </div>
                </div>

                <!-- Formulario de nueva suscripción (oculto hasta que se pulse el botón) -->
                <form id="formNuevaSuscripcion" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 grid grid-cols-1 md:grid-cols-4 gap-3 hidden">
                    <select id="nuevoCliente" required class="px-3 py-2 border border-slate-200 rounded-lg text-sm md:col-span-2"><option value="">Cliente...</option></select>
                    <select id="nuevoTipo" required class="px-3 py-2 border border-slate-200 rounded-lg text-sm">
                        <option value="1">Diario</option>
                        <option value="2">Semanal</option>
                        <option value="3" selected>Mensual</option>
                    </select>
                    <select id="nuevoMetodoPago" class="px-3 py-2 border border-slate-200 rounded-lg text-sm">
                        <option value="efectivo">Efectivo</option>
                        <option value="tarjeta">Tarjeta</option>
                        <option value="transferencia">Transferencia</option>
                    </select>
                    <button type="submit" class="bg-emerald-600 text-white rounded-lg text-sm font-semibold hover:bg-emerald-700 md:col-span-4">Registrar pago y crear suscripción</button>
                    <p id="mensajeNuevaSuscripcion" class="text-xs md:col-span-4"></p>
                </form>

                <!-- Tabla de Suscripciones -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
                    <table class="w-full min-w-[560px] text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-400 text-xs font-bold uppercase tracking-wider border-b border-slate-200">
                                <th class="p-4">Socio / Cliente</th>
                                <th class="p-4">Tipo de Plan</th>
                                <th class="p-4">Vencimiento</th>
                                <th class="p-4">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaSuscripciones" class="divide-y divide-slate-100 text-sm text-slate-700">
                            <tr><td class="p-4 text-slate-400" colspan="4">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
<script src="public/js/panel-common.js"></script>
<script src="public/js/suscripciones.js"></script>
<script src="public/js/branding.js?v=1"></script>
</body>
</html>
